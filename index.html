<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1 class="text-success">Informe o CEP</h1>

        <p>Digite o CEP e ao sair o campo o endereço será completado. Pode utilizar a tecla TAB após digitar o CEP.</p>

        <div class="row mb-3">
            <div class="col-auto"><label for="cep">Cep:</label></div>
            <div class="col-2"><input type="text" id="cep" class="form-control" placeholder="00000-000"></div>
        </div>

        <div class="row mb-3">
            <div class="col-auto"><label for="rua">Rua:</label></div>
            <div class="col-8"><input type="text" id="rua" class="form-control"></div>
        </div>

        <div class="row mb-3">
            <div class="col-auto"><label for="bairro">Bairro:</label></div>
            <div class="col-8"><input type="text" id="bairro" class="form-control"></div>
        </div>

        <div class="row mb-3">
            <div class="col-auto"><label for="cidade">Cidade:</label></div>
            <div class="col-6"><input type="text" id="cidade" class="form-control"></div>
        </div>

        <div class="row mb-3">
            <div class="col-auto"><label for="estado">Estado:</label></div>
            <div class="col-1"><input type="text" id="estado" class="form-control"></div>
        </div>

        <div class="row mb-3">
            <div class="col-auto"><label for="ibge">IBGE:</label></div>
            <div class="col-5"><input type="text" id="ibge" class="form-control"></div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
