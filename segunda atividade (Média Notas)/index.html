<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Segunda Atividade</title>
</head>
<body>

    <div class="container">
        
        <div>
            <h1 class="text-success">Média das notas</h1>
        </div>

        <div>
            
            <p>Abaixo digite seu nome e suas notas</p>
        </div>

        <div class="mb-3">
            <form action="">

                <div class="row mb-3">
                    <label for="nome" class="col-auto">Nome:</label>
                    <input type="text" id="nome" class="col-6">
                </div>

                <div class="row mb-3">
                    <label for="nota1" class="col-auto legendas">Primeira nota:</label>
                <!--O atributo for da <label> está associado ao "id" do input, caso o usuário clicar no texto da label 
                    o foco irá para o campo de texto da nota ao qual o atributo "for" está associado-->
                    <input type="text" id="nota1" class="col-2 notas">
                </div>

                <div class="row mb-3">
                    <label for="nota2" class="col-auto legendas">Segunda nota:</label>
                    <input type="text" id="nota2" class="col-2 notas">
                </div>

                <div class="row mb-3">
                    <label for="nota3" class="col-auto legendas">Terceira nota:</label>
                    <input type="text" id="nota3" class="col-2 notas">
                </div>

                <div class="row mb-3">
                    <label for="nota4" class="col-auto legendas">Quarta nota:</label>
                    <input type="text" id="nota4" class="col-2 notas">
                </div>

                <div class="mb-3"><button type="button" id="enviaFormulario" onclick="enviaForm()">Registrar resultado</button></div>

            </form>

            <div>
                <p>Média calculada: <span id="mediaReal"></span></p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
